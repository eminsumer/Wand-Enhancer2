name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Publish EXE
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path .\WandEnhancer -Filter *.csproj -Recurse | Select-Object -First 1
          dotnet restore $csproj.FullName
          dotnet publish $csproj.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\publish-out

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-win-x64
          path: .\publish-out\*.exe
