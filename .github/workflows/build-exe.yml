name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
          if ($sln) {
            nuget restore $sln.FullName
          } else {
            $csproj = Get-ChildItem -Path .\WandEnhancer -Filter *.csproj -Recurse | Select-Object -First 1
            nuget restore $csproj.FullName
          }

      - name: Remove Missing Source File Entries
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path .\WandEnhancer -Filter *.csproj -Recurse | Select-Object -First 1
          $missing = @('ElectronFuseWire.cs', 'EnhancerConfig.cs', 'DiskFusePatch.cs')
          $lines = Get-Content -Path $csproj.FullName
          $filtered = $lines | Where-Object {
            $line = $_
            -not ($missing | Where-Object { $line -match [regex]::Escape($_) })
          }
          Set-Content -Path $csproj.FullName -Value $filtered

      - name: Build EXE with MSBuild
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path .\WandEnhancer -Filter *.csproj -Recurse | Select-Object -First 1
          msbuild $csproj.FullName /p:Configuration=Release /p:Platform=AnyCPU /t:Build /m

      - name: Collect EXE Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\publish-out | Out-Null
          Get-ChildItem -Path .\WandEnhancer -Include *.exe -Recurse |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Copy-Item -Destination .\publish-out -Force
          Get-ChildItem .\publish-out

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-win-x64
          path: .\publish-out\*
